global_defs {
    router_id LVS_BACKUP
    notification_email {
        admin@example.com
    }
    notification_email_from keepalived@example.com
    smtp_server localhost
    smtp_connect_timeout 30
}

vrrp_script check_gateway {
    script "/usr/local/bin/check_gateway.sh"
    interval 2
    weight -20
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 50
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1234
    }
    virtual_ipaddress {
        192.168.1.100/24 dev eth0 label eth0:1
    }
    track_script {
        check_gateway
    }
    notify "/usr/local/bin/notify.sh"
}
