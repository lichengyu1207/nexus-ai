<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Seat/chair base -->
  <rect x="24" y="100" width="80" height="12" rx="4" fill="#374151"/>
  <rect x="20" y="108" width="8" height="16" rx="2" fill="#4B5563"/>
  <rect x="100" y="108" width="8" height="16" rx="2" fill="#4B5563"/>
  
  <!-- Body - sitting, slightly compressed -->
  <ellipse cx="64" cy="82" rx="32" ry="32" fill="url(#bodyGradient)"/>
  <ellipse cx="54" cy="74" rx="10" ry="14" fill="#60A5FA" opacity="0.3"/>
  
  <!-- Face screen -->
  <ellipse cx="64" cy="76" rx="26" ry="24" fill="#F8FAFC"/>
  
  <!-- Eyes - relaxed -->
  <ellipse cx="52" cy="72" rx="5" ry="6" fill="#1E40AF"/>
  <ellipse cx="76" cy="72" rx="5" ry="6" fill="#1E40AF"/>
  
  <!-- Eye highlights -->
  <circle cx="54" cy="70" r="1.5" fill="#FFFFFF"/>
  <circle cx="78" cy="70" r="1.5" fill="#FFFFFF"/>
  
  <!-- Content smile -->
  <path d="M54 86 Q64 92 74 86" stroke="#1E40AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Antenna base -->
  <rect x="58" y="44" width="12" height="7" rx="2" fill="#374151"/>
  
  <!-- House antenna -->
  <path d="M64 20 L52 36 L76 36 Z" fill="url(#houseGradient)"/>
  <rect x="58" y="36" width="12" height="9" fill="#60A5FA"/>
  <rect x="61" y="39" width="5" height="5" fill="#1D4ED8"/>
  
  <!-- Antenna connector -->
  <rect x="61" y="44" width="6" height="3" fill="#4B5563"/>
  
  <!-- Arms - resting on seat -->
  <ellipse cx="28" cy="88" rx="9" ry="12" fill="url(#bodyGradient)"/>
  <ellipse cx="100" cy="88" rx="9" ry="12" fill="url(#bodyGradient)"/>
  
  <!-- Feet - dangling -->
  <ellipse cx="44" cy="108" rx="12" ry="6" fill="url(#bodyGradient)"/>
  <ellipse cx="84" cy="108" rx="12" ry="6" fill="url(#bodyGradient)"/>
  
  <!-- Chest light -->
  <circle cx="64" cy="98" r="5" fill="#34D399"/>
  <circle cx="64" cy="98" r="2.5" fill="#86EFAC"/>
</svg>