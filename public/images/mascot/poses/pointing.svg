<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="64" cy="122" rx="28" ry="4" fill="#00000020"/>
  
  <!-- Body - slightly turned -->
  <ellipse cx="64" cy="78" rx="34" ry="38" fill="url(#bodyGradient)"/>
  <ellipse cx="54" cy="68" rx="12" ry="16" fill="#60A5FA" opacity="0.3"/>
  
  <!-- Face screen -->
  <ellipse cx="64" cy="72" rx="28" ry="26" fill="#F8FAFC"/>
  
  <!-- Eyes - looking right -->
  <ellipse cx="52" cy="68" rx="6" ry="7" fill="#1E40AF"/>
  <ellipse cx="76" cy="68" rx="6" ry="7" fill="#1E40AF"/>
  
  <!-- Eye highlights - shifted right -->
  <circle cx="55" cy="66" r="2" fill="#FFFFFF"/>
  <circle cx="79" cy="66" r="2" fill="#FFFFFF"/>
  
  <!-- Helpful smile -->
  <path d="M52 82 Q64 90 76 82" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Antenna base -->
  <rect x="58" y="38" width="12" height="8" rx="2" fill="#374151"/>
  
  <!-- House antenna -->
  <path d="M64 12 L52 28 L76 28 Z" fill="url(#houseGradient)"/>
  <rect x="58" y="28" width="12" height="10" fill="#60A5FA"/>
  <rect x="62" y="32" width="4" height="6" fill="#1D4ED8"/>
  
  <!-- Antenna connector -->
  <rect x="61" y="38" width="6" height="4" fill="#4B5563"/>
  
  <!-- Left arm - relaxed -->
  <ellipse cx="26" cy="82" rx="10" ry="14" fill="url(#bodyGradient)"/>
  
  <!-- Right arm - pointing -->
  <ellipse cx="106" cy="68" rx="10" ry="14" fill="url(#bodyGradient)" transform="rotate(20, 106, 68)"/>
  
  <!-- Pointing hand/finger -->
  <ellipse cx="118" cy="58" rx="6" ry="4" fill="url(#bodyGradient)" transform="rotate(20, 118, 58)"/>
  
  <!-- Pointing line/direction indicator -->
  <line x1="112" y1="52" x2="124" y2="44" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>
  
  <!-- Arrow head -->
  <polygon points="126,40 120,46 124,48" fill="#60A5FA"/>
  
  <!-- Feet -->
  <ellipse cx="48" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  <ellipse cx="80" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  
  <!-- Chest light -->
  <circle cx="64" cy="98" r="6" fill="#34D399"/>
  <circle cx="64" cy="98" r="3" fill="#86EFAC"/>
</svg>