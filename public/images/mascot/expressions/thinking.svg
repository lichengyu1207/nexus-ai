<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="64" cy="78" rx="36" ry="38" fill="url(#bodyGradient)"/>
  <ellipse cx="54" cy="68" rx="12" ry="16" fill="#60A5FA" opacity="0.3"/>
  
  <!-- Face screen -->
  <ellipse cx="64" cy="72" rx="28" ry="26" fill="#F8FAFC"/>
  
  <!-- Thinking eyes - looking up-right -->
  <ellipse cx="52" cy="66" rx="6" ry="5" fill="#1E40AF"/>
  <ellipse cx="76" cy="66" rx="6" ry="5" fill="#1E40AF"/>
  
  <!-- Eye highlights - shifted up-right -->
  <circle cx="55" cy="64" r="2" fill="#FFFFFF"/>
  <circle cx="79" cy="64" r="2" fill="#FFFFFF"/>
  
  <!-- Thinking mouth - slight curve -->
  <path d="M56 84 Q64 86 72 84" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Thought bubble -->
  <circle cx="100" cy="28" r="4" fill="#E5E7EB"/>
  <circle cx="108" cy="20" r="6" fill="#E5E7EB"/>
  <circle cx="118" cy="10" r="8" fill="#E5E7EB"/>
  
  <!-- Question mark in thought bubble -->
  <text x="114" y="15" font-family="Arial" font-size="12" font-weight="bold" fill="#6B7280">?</text>
  
  <!-- Antenna base -->
  <rect x="58" y="38" width="12" height="8" rx="2" fill="#374151"/>
  
  <!-- House antenna - tilted slightly -->
  <g transform="rotate(-5, 64, 28)">
    <path d="M64 12 L52 28 L76 28 Z" fill="url(#houseGradient)"/>
    <rect x="58" y="28" width="12" height="10" fill="#60A5FA"/>
    <rect x="62" y="32" width="4" height="6" fill="#1D4ED8"/>
  </g>
  
  <!-- Antenna connector -->
  <rect x="61" y="38" width="6" height="4" fill="#4B5563"/>
  
  <!-- Arms - one hand on chin -->
  <ellipse cx="24" cy="82" rx="10" ry="14" fill="url(#bodyGradient)"/>
  <ellipse cx="90" cy="62" rx="10" ry="14" fill="url(#bodyGradient)" transform="rotate(30, 90, 62)"/>
  
  <!-- Feet -->
  <ellipse cx="48" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  <ellipse cx="80" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  
  <!-- Chest light -->
  <circle cx="64" cy="98" r="6" fill="#FCD34D"/>
  <circle cx="64" cy="98" r="3" fill="#FEF3C7"/>
</svg>