<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="64" cy="78" rx="36" ry="38" fill="url(#bodyGradient)"/>
  <ellipse cx="54" cy="68" rx="12" ry="16" fill="#60A5FA" opacity="0.3"/>
  
  <!-- Face screen -->
  <ellipse cx="64" cy="72" rx="28" ry="26" fill="#F8FAFC"/>
  
  <!-- Surprised eyes - big and round -->
  <circle cx="52" cy="66" r="10" fill="#1E40AF"/>
  <circle cx="76" cy="66" r="10" fill="#1E40AF"/>
  
  <!-- Eye highlights -->
  <circle cx="55" cy="63" r="3" fill="#FFFFFF"/>
  <circle cx="79" cy="63" r="3" fill="#FFFFFF"/>
  
  <!-- Raised eyebrows -->
  <path d="M42 54 Q52 48 62 54" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M66 54 Q76 48 86 54" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Surprised mouth - O shape -->
  <ellipse cx="64" cy="86" rx="8" ry="10" fill="#1E40AF"/>
  <ellipse cx="64" cy="84" rx="4" ry="5" fill="#1E40AF"/>
  
  <!-- Exclamation marks -->
  <text x="28" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#F59E0B">!</text>
  <text x="92" y="36" font-family="Arial" font-size="12" font-weight="bold" fill="#FCD34D">!</text>
  
  <!-- Sparkle lines -->
  <line x1="20" y1="60" x2="12" y2="52" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="10" y2="64" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="60" x2="116" y2="52" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="64" x2="118" y2="64" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Antenna base -->
  <rect x="58" y="38" width="12" height="8" rx="2" fill="#374151"/>
  
  <!-- House antenna -->
  <path d="M64 12 L52 28 L76 28 Z" fill="url(#houseGradient)"/>
  <rect x="58" y="28" width="12" height="10" fill="#60A5FA"/>
  <rect x="62" y="32" width="4" height="6" fill="#1D4ED8"/>
  
  <!-- Antenna connector -->
  <rect x="61" y="38" width="6" height="4" fill="#4B5563"/>
  
  <!-- Arms - raised in surprise -->
  <ellipse cx="18" cy="58" rx="10" ry="14" fill="url(#bodyGradient)" transform="rotate(-30, 18, 58)"/>
  <ellipse cx="110" cy="58" rx="10" ry="14" fill="url(#bodyGradient)" transform="rotate(30, 110, 58)"/>
  
  <!-- Feet -->
  <ellipse cx="48" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  <ellipse cx="80" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  
  <!-- Chest light -->
  <circle cx="64" cy="98" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="98" r="3" fill="#FCD34D"/>
</svg>