<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="64" cy="78" rx="36" ry="38" fill="url(#bodyGradient)"/>
  <ellipse cx="54" cy="68" rx="12" ry="16" fill="#60A5FA" opacity="0.3"/>
  
  <!-- Face screen -->
  <ellipse cx="64" cy="72" rx="28" ry="26" fill="#F8FAFC"/>
  
  <!-- Confused eyes - different sizes -->
  <ellipse cx="52" cy="68" rx="7" ry="8" fill="#1E40AF"/>
  <ellipse cx="76" cy="68" rx="5" ry="6" fill="#1E40AF"/>
  
  <!-- Eye highlights -->
  <circle cx="54" cy="66" r="2" fill="#FFFFFF"/>
  <circle cx="77" cy="66" r="1.5" fill="#FFFFFF"/>
  
  <!-- Raised eyebrow -->
  <path d="M44 58 Q52 54 60 58" stroke="#1E40AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M68 60 Q76 56 84 60" stroke="#1E40AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Confused mouth - wavy -->
  <path d="M52 84 Q58 80 64 84 Q70 88 76 84" stroke="#1E40AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Question marks -->
  <text x="32" y="48" font-family="Arial" font-size="14" font-weight="bold" fill="#6B7280">?</text>
  <text x="88" y="42" font-family="Arial" font-size="10" font-weight="bold" fill="#9CA3AF">?</text>
  
  <!-- Antenna base - tilted -->
  <rect x="58" y="38" width="12" height="8" rx="2" fill="#374151" transform="rotate(5, 64, 42)"/>
  
  <!-- House antenna - tilted -->
  <g transform="rotate(5, 64, 28)">
    <path d="M64 12 L52 28 L76 28 Z" fill="url(#houseGradient)"/>
    <rect x="58" y="28" width="12" height="10" fill="#60A5FA"/>
    <rect x="62" y="32" width="4" height="6" fill="#1D4ED8"/>
  </g>
  
  <!-- Antenna connector -->
  <rect x="61" y="38" width="6" height="4" fill="#4B5563"/>
  
  <!-- Arms - one scratching head -->
  <ellipse cx="24" cy="82" rx="10" ry="14" fill="url(#bodyGradient)"/>
  <ellipse cx="88" cy="50" rx="10" ry="14" fill="url(#bodyGradient)" transform="rotate(45, 88, 50)"/>
  
  <!-- Feet -->
  <ellipse cx="48" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  <ellipse cx="80" cy="116" rx="14" ry="8" fill="url(#bodyGradient)"/>
  
  <!-- Chest light -->
  <circle cx="64" cy="98" r="6" fill="#FCD34D"/>
  <circle cx="64" cy="98" r="3" fill="#FEF3C7"/>
</svg>