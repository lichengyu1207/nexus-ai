<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房都督AI - 测试页面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }
    .status {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .status.ok { color: #16a34a; }
    .status.error { color: #dc2626; background: #fef2f2; border-color: #fca5a5; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin: 5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      text-align: left;
    }
    .info p { margin: 5px 0; color: #475569; }
    .info strong { color: #1e293b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏠 房都督AI</h1>
    <p class="subtitle">智能房产分析平台</p>
    
    <div id="backend-status" class="status">
      检查后端状态中...
    </div>
    
    <div>
      <a href="/login" class="btn">登录</a>
      <a href="/property-analysis" class="btn">开始分析</a>
    </div>
    
    <div class="info">
      <p><strong>前端服务:</strong> <span id="frontend-status">运行中 ✓</span></p>
      <p><strong>后端API:</strong> <span id="api-status">检查中...</span></p>
      <p><strong>端口:</strong> 前端 5173 | 后端 8000</p>
    </div>
  </div>

  <script>
    // 检查后端状态
    fetch('http://localhost:8000/api/health')
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        document.getElementById('backend-status').innerHTML = '✓ 后端服务正常';
        document.getElementById('backend-status').className = 'status ok';
        document.getElementById('api-status').textContent = '运行中 ✓';
      })
      .catch(err => {
        document.getElementById('backend-status').innerHTML = '✗ 后端服务异常';
        document.getElementById('backend-status').className = 'status error';
        document.getElementById('api-status').textContent = '未连接';
      });
  </script>
</body>
</html>
