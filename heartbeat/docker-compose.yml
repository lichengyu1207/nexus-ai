version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: heartbeat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  heartbeat-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heartbeat-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HEARTBEAT_INTERVAL=5
      - HEARTBEAT_TTL=15
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
